<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDesk 被控端</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e4e7ec; --text: #1d2433; --muted: #6b7385;
    --ok: #12805c; --ok-bg: #e7f6ef; --warn: #a15c00; --warn-bg: #fff4e0; --bad: #c0262d; --bad-bg: #fdecec;
    --info: #3b5bdb; --info-bg: #eef2ff;
    --s1: #3b82f6; --s2: #10b981; --s3: #f59e0b; --s4: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1017; --card: #151a23; --line: #262d3a; --text: #e6e9ef; --muted: #8a93a6;
      --ok: #4ade80; --ok-bg: #12261c; --warn: #fbbf24; --warn-bg: #2a2110; --bad: #f87171; --bad-bg: #2c1515;
      --info: #93a8ff; --info-bg: #171d33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--info-bg); color: var(--info); }
  .pill.on { background: var(--ok-bg); color: var(--ok); }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .verdicts { display: flex; flex-direction: column; gap: 8px; }
  .vd { padding: 10px 14px; border-radius: 10px; font-size: 14px; }
  .vd.ok { background: var(--ok-bg); color: var(--ok); }
  .vd.warn { background: var(--warn-bg); color: var(--warn); }
  .vd.bad { background: var(--bad-bg); color: var(--bad); }
  .vd.info { background: var(--info-bg); color: var(--info); }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
  canvas { width: 100%; height: 180px; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  td:first-child { color: var(--muted); width: 40%; }
  .conn { padding: 18px 20px; margin-bottom: 8px; }
  .conn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .big { font-size: 22px; font-weight: 700; letter-spacing: .3px; margin-top: 2px; word-break: break-all; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 9px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 2px 9px; font-size: 12px; margin-left: 6px; vertical-align: middle; }
  .perms { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }
  .perm-ok { color: var(--ok); } .perm-bad { color: var(--bad); }
  .perms a { color: var(--info); }
  .webrow { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .webrow b { display: block; font-size: 14px; margin-bottom: 4px; }
  .webrow .link { font-family: ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; color: var(--info); margin: 6px 0; }
  .webrow .btn { display: inline-block; margin: 8px 6px 0 0; text-decoration: none; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">RDesk 被控端</h1>
    <span class="pill" id="state" data-t="waiting">等待连接</span>
    <span class="muted" id="sub"></span>
    <button class="btn danger small" id="kick" data-t="kick" hidden>断开控制端</button>
  </header>

  <section class="card conn">
    <div class="conn-grid">
      <div><div class="k" data-t="addrLabel">远程地址（填到控制端 RDesk 里）</div><div class="big mono" id="addr">–</div></div>
      <div><div class="k" data-t="id">设备 ID</div><div class="big mono" id="cid">–</div></div>
      <div><div class="k" data-t="pw">密码</div><div class="big mono"><span id="pw">••••••••</span><button class="btn small" id="showpw" data-t="show">显示</button></div></div>
    </div>
    <div class="row">
      <button class="btn primary" id="copy" data-t="copy">复制地址 / ID / 密码</button>
      <button class="btn" id="newpw" data-t="newpw">换新密码</button>
      <button class="btn danger" id="quit" data-t="quit">退出被控端</button>
    </div>
    <div class="perms" id="perms"></div>
    <div class="perms" id="ts"></div>
    <div class="perms" id="upd"></div>
    <div class="webrow" id="web" hidden></div>
    <div class="webrow" id="share" hidden></div>
  </section>

  <div id="diagArea">
  <h2>诊断结论</h2>
  <div class="verdicts" id="verdicts"></div>

  <div class="grid" id="nums"></div>

  <div class="charts">
    <div class="card">
      <div class="k">帧率（fps）</div>
      <canvas id="c1"></canvas>
      <div class="legend"><span><i style="background:var(--s1)"></i>截屏</span><span><i style="background:var(--s2)"></i>发出</span><span><i style="background:var(--s3)"></i>手机显示</span></div>
    </div>
    <div class="card">
      <div class="k">延迟（ms）</div>
      <canvas id="c2"></canvas>
      <div class="legend"><span><i style="background:var(--s1)"></i>帧往返（发出→手机显示→确认）</span><span><i style="background:var(--s2)"></i>心跳往返</span><span><i style="background:var(--s4)"></i>Tailscale ping</span></div>
    </div>
  </div>

  <div class="two" style="margin-top:10px">
    <div class="card"><div class="k" style="margin-bottom:6px">本次连接</div><table id="sess"></table></div>
    <div class="card"><div class="k" style="margin-bottom:6px">手机端上报</div><table id="viewer"></table></div>
  </div>
  </div>
</main>

let col = 0; // 下标进 LANGS；api/info 返回后更新
function t(k, ...a) { const row = TR[k]; let s = row ? row[col] || row[0] : k; a.forEach((v, i) => s = s.replace("{" + i + "}", v)); return s; }
function applyLang(code) {
  const i = Math.max(0, LANGS.indexOf(code));
  if (i === col && document.documentElement.dataset.l) return;
  col = i; document.documentElement.dataset.l = code;
  document.documentElement.lang = code; document.title = t("title");
  document.querySelectorAll("[data-t]").forEach((el) => el.textContent = t(el.dataset.t));
}
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tsHist = [];

function chart(el, series, hist) {
  const dpr = devicePixelRatio || 1, w = el.clientWidth, h = el.clientHeight;
  el.width = w * dpr; el.height = h * dpr;
  const g = el.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const pts = hist.slice(-120);
  let maxV = 10;
  for (const s of series) for (const p of pts) maxV = Math.max(maxV, s.get(p) || 0);
  maxV = Math.ceil(maxV * 1.15 / 10) * 10;
  g.strokeStyle = css("--line"); g.fillStyle = css("--muted"); g.font = "11px -apple-system"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = 4 + (h - 20) * i / 4;
    g.beginPath(); g.moveTo(30, y); g.lineTo(w, y); g.stroke();
    g.fillText(Math.round(maxV * (1 - i / 4)), 0, y + 4);
  }
  for (const s of series) {
    g.strokeStyle = css(s.color); g.lineWidth = 2; g.beginPath();
    let started = false;
    pts.forEach((p, i) => {
      const v = s.get(p); if (v == null || v === 0 && s.skipZero) { started = false; return; }
      const x = 30 + (w - 30) * i / Math.max(1, 119), y = 4 + (h - 20) * (1 - v / maxV);
      started ? g.lineTo(x, y) : g.moveTo(x, y); started = true;
    });
    g.stroke();
  }
}

const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d);

async function tick() {

  catch { $("state").textContent = t("notRunning"); $("state").className = "pill"; return; }
  $("state").textContent = d.active ? t("connected") : t("waiting");
  $("state").className = "pill" + (d.active ? " on" : "");
  $("kick").hidden = !d.active;
  if (d.diag === false) { $("diagArea").style.display = "none"; $("sub").textContent = d.active ? t("subActive") : t("subIdle"); return; }
  $("sub").textContent = d.active ? `控制端 ${d.viewerIP} · ${d.codec || "握手中"} · 已连接 ${Math.round((Date.now() - d.since) / 1000)} 秒` : "";

  $("verdicts").innerHTML = (d.verdicts || []).map((v) => `<div class="vd ${v.level}">${v.msg}</div>`).join("");

  const n = d.now || {}, ts = d.tailscale || {};
  const cards = [
    ["截屏帧率", fmt(n.cap), "fps"], ["编码帧率", fmt(n.enc), "fps"], ["发出帧率", fmt(n.sent), "fps"],
    ["手机显示", fmt(n.view), "fps"], ["码率", fmt(n.kbps), "kbps"], ["帧往返", fmt(n.ack), "ms"],
    ["心跳往返", fmt(n.ping), "ms"], ["Tailscale", ts.path ? fmt(ts.pingMs) : "–", ts.path ? "ms" : ""],
    ["编码耗时", fmt(n.encLat, 1), "ms"], ["网络暂停", fmt(n.pause), "次/秒"], ["键鼠事件", fmt(n.input), "/秒"], ["声音", n.audio ? fmt(n.audio) : "关", n.audio ? "包/秒" : ""], ["声音电平", n.audio ? fmt((n.audioPk || 0) * 100) : "–", n.audio ? "%" : ""],
  ];
  $("nums").innerHTML = cards.map(([k, v, u]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join("");

  const hist = d.hist || [];
  if (ts.at && (!tsHist.length || tsHist[tsHist.length - 1].at !== ts.at)) tsHist.push(ts);
  const tsAt = (p) => { let best = null; for (const t of tsHist) if (t.at <= p.t + 1000) best = t; return best && best.pingMs; };
  chart($("c1"), [{ color: "--s1", get: (p) => p.cap }, { color: "--s2", get: (p) => p.sent }, { color: "--s3", get: (p) => p.view }], hist);
  chart($("c2"), [{ color: "--s1", get: (p) => p.ack, skipZero: true }, { color: "--s2", get: (p) => p.ping, skipZero: true }, { color: "--s4", get: tsAt, skipZero: true }], hist);

  const set = d.settings || {};
  const rows = [
    ["Tailscale 路径", ts.path || ts.err || "–"], ["画质", `质量 ${set.q ?? "–"} · 最大宽 ${set.maxw ?? "–"} · ${set.fps ?? "–"} fps`],
    ["码率（自适应）", `当前 ${d.kbpsNow ?? "–"} / 上限 ${d.kbpsTarget ?? "–"} kbps`], ["累计发出帧", d.sentFrames ?? "–"], ["其中关键帧", d.keyFrames ?? "–"], ["累计网络暂停", d.pauses ?? "–"],
  ];
  $("sess").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  const vw = d.viewer || {};
  const names = { fps: "显示帧率", rtt: "心跳往返 ms", kbps: "接收 kbps", decodeMs: "收到→送显 ms", connect: "连接耗时", dropped: "丢弃帧", mode: "操作模式", orient: "屏幕方向", device: "设备", app: "App 版本", net: "网络" };
  $("viewer").innerHTML = Object.keys(vw).length ? Object.entries(vw).map(([k, v]) => `<tr><td>${names[k] || k}</td><td>${typeof v === "number" ? fmt(v, v % 1 ? 1 : 0) : v}</td></tr>`).join("") : `<tr><td>–</td><td class="muted">新版 App 才会上报</td></tr>`;
}
let info = null, showPw = false;
const H = { "X-RDesk": "1" };
async function loadInfo() {
  try { info = await (await fetch("api/info", { headers: H, cache: "no-store" })).json(); } catch { return; }
  applyLang(info.lang);
  $("addr").textContent = info.addr || "–";
  $("cid").textContent = info.id || "–";
  $("pw").textContent = showPw ? info.password : "••••••••";
  const perm = (ok, name, pane) => ok ? `<span class="perm-ok">✓ ${t(name)}</span>` :
    `<span class="perm-bad">${t("permOff", t(name))}</span> <a href="x-apple.systempreferences:com.apple.preference.security?${pane}">${t("enable")}</a>`;
  // 屏幕录制 / 辅助功能权限只有 Mac 有
  $("perms").innerHTML = (info.os === "darwin" ? perm(info.screen, "screen", "Privacy_ScreenCapture") + perm(info.access, "access", "Privacy_Accessibility") : "") +
    `<span class="muted">${TR["m_" + info.mode] ? t("m_" + info.mode) : info.mode} · v${info.version}</span>`;
  renderTS();
  renderWeb(info.web || {});
  renderUpd(info.update || {});
}
function renderUpd(u) {
  let st = "";
  if (u.state === "checking") st = `<span class="muted">${t("upChecking")}</span>`;
  else if (u.state === "latest") st = `<span class="perm-ok">✓ ${t("upLatest")}</span>`;
  else if (u.state === "waiting") st = `<span>${t("upWaiting", esc(u.latest))}</span>`;
  else if (u.state === "downloading") st = `<span>${t("upDownloading", esc(u.latest))}</span>`;
  else if (u.state === "available") st = `<span>${t("upAvail", esc(u.latest))}</span>`;
  else if (u.state === "error") st = `<span class="perm-bad">${t("upFail", esc(u.err || ""))}</span>`;
  let btn = "";
  if (u.state === "available" && !u.can) btn = `<a href="${col === 0 || col === 2 ? "https://rdeskapp.com/#download" : "https://rdeskapp.com/en/#download"}" target="_blank" rel="noopener">${t("upManual")}</a>`;
  else if (u.state !== "checking" && u.state !== "downloading") btn = `<button class="btn small" id="updCheck">${u.state === "waiting" || u.state === "available" ? t("updateNow") : t("checkUpdate")}</button>`;
  const h = `<label><input type="checkbox" id="updAuto"${u.auto ? " checked" : ""}> ${t("autoUpdate")}</label>${st}${btn}`;
  const el = $("upd");
  if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
}
document.addEventListener("change", async (e) => {
  if (e.target.id === "updAuto") { await fetch("api/update?auto=" + (e.target.checked ? 1 : 0), { method: "POST", headers: H }); loadInfo(); }
});
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function copyBtn(btn, text) {
  await navigator.clipboard.writeText(text);
  const old = btn.textContent; btn.textContent = t("copied"); setTimeout(() => btn.textContent = old, 1500);
}
function renderWeb(w) {
  const tsMode = info.mode === "tailscale";
  const web = $("web"), share = $("share");
  web.hidden = !tsMode; share.hidden = !w.canShare;
  if (tsMode) {
    let h = `<b>${t("webTitle")}</b>`;
    if (w.link) h += `<div>${t("webReady")}</div><div class="link">${esc(w.link)}</div><button class="btn" data-copy="${esc(w.link)}">${t("copyLink")}</button>`;
    else if (w.certErr === "https-off") h += `<div>${t("webOff")}</div><a class="btn" href="https://login.tailscale.com/admin/dns" target="_blank" rel="noopener">${t("webOffBtn")}</a>`;
    else if (w.certErr === "pending") h += `<div class="muted">${t("webPending")}</div>`;
    else if (w.certErr) h += `<div class="perm-bad">${t("webErr", esc(w.certErr))}</div>`;
    if (web.dataset.h !== h) { web.innerHTML = h; web.dataset.h = h; }
  }
  if (w.canShare) {
    let h = `<b>${t("shareTitle")}</b>`;
    if (w.share) {
      const mins = Math.max(1, Math.ceil((w.shareUntil - Date.now()) / 60000));
      h += `<div>${t("shareOn", mins)}</div><div class="link">${esc(w.share)}</div><button class="btn" data-copy="${esc(w.share)}">${t("copyLink")}</button><button class="btn danger" id="shareStop">${t("shareStop")}</button>`;
    } else if (w.shareBusy) h += `<div class="muted">${t("shareBusy")}</div>`;
    else {
      h += `<div>${t("shareIdle")}</div>`;
      if (w.shareErr) h += `<div class="perm-bad">${t("shareFail", esc(w.shareErr))}</div>`;
      h += `<button class="btn" id="shareStart">${t("shareBtn")}</button>`;
    }
    if (share.dataset.h !== h) { share.innerHTML = h; share.dataset.h = h; }
  }
}
$("kick").onclick = async () => { await fetch("api/kick", { method: "POST", headers: H }); tick(); };
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) return copyBtn(b, b.dataset.copy);
  if (b.id === "shareStart") {
    if (!confirm(t("shareConfirm"))) return;
    await fetch("api/share?on=1", { method: "POST", headers: H });
    setTimeout(loadInfo, 300);
  }
  if (b.id === "updCheck") { await fetch("api/update?check=1", { method: "POST", headers: H }); setTimeout(loadInfo, 500); return; }
  if (b.id === "shareStop") { await fetch("api/share?on=0", { method: "POST", headers: H }); loadInfo(); }
});
function renderTS() {
  if (!info) return;
  let h;
  const dl = "https://tailscale.com/download/" + (info.os === "windows" ? "windows" : "mac");
  if (info.tsIP) h = `<span class="perm-ok">${t("tsOk", info.tsIP)}</span><span class="muted">${t("tsOkHint")}</span>`;
  else if (info.tsInstalled) h = `<span class="perm-bad">${t("tsOff")}</span><span>${t("tsOffHint")}</span>`;
  else h = `<span class="perm-bad">${t("tsNone")}</span><a href="${dl}" target="_blank" rel="noopener">${t("tsDl")}</a><span class="muted">${t("tsNoneHint")}</span>`;
  $("ts").innerHTML = h;
}
$("showpw").onclick = () => { showPw = !showPw; $("showpw").textContent = showPw ? t("hide") : t("show"); loadInfo(); };
$("copy").onclick = async () => {
  if (!info) return;
  await navigator.clipboard.writeText(t("copyText", info.addr, info.id, info.password));
  $("copy").textContent = t("copied"); setTimeout(() => $("copy").textContent = t("copy"), 1500);
};
$("newpw").onclick = async () => {
  if (!confirm(t("confirmNew"))) return;
  await fetch("api/newpw", { method: "POST", headers: H });
  showPw = true; $("showpw").textContent = t("hide"); loadInfo();
};
$("quit").onclick = async () => {
  if (!confirm(t("confirmQuit"))) return;
  await fetch("api/quit", { method: "POST", headers: H });
  document.body.innerHTML = `<main><h1>${t("quitTitle")}</h1><p class='muted'>${t("quitHint")}</p></main>`;
};
loadInfo(); setInterval(loadInfo, 3000);
tick(); setInterval(tick, 1000);
addEventListener("resize", tick);
</script>
</body>
</html>
